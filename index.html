<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOBIG for All</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f7f5fb;
 color:#222
}
header{
 background:#6f42c1;
 color:white;
 padding:22px 18px;
 text-align:center;
 border-radius:0 0 25px 25px
}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
.container{padding:18px;max-width:700px;margin:auto}
.products{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:14px
}
.card{
 background:white;
 border-radius:18px;
 padding:12px;
 box-shadow:0 3px 12px #0001
}
.card img{
 width:100%;
 height:150px;
 object-fit:cover;
 border-radius:14px
}
.card h3{margin:10px 0 5px}
.price{
 color:#6f42c1;
 font-weight:bold;
 font-size:19px
}
button{
 border:0;
 border-radius:12px;
 padding:11px 15px;
 background:#6f42c1;
 color:white;
 font-size:16px;
 cursor:pointer
}
.cart{
 margin-top:20px;
 background:white;
 padding:18px;
 border-radius:18px;
 box-shadow:0 3px 12px #0001
}
input{
 width:100%;
 padding:13px;
 margin:6px 0;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:16px
}
.cart-item{
 display:flex;
 justify-content:space-between;
 padding:10px 0;
 border-bottom:1px solid #eee
}
.total{
 font-size:21px;
 font-weight:bold;
 margin:15px 0
}
@media(max-width:430px){
 .products{grid-template-columns:1fr 1fr}
 .card img{height:120px}
}
</style>
</head>

<body>

<header>
<h1>GOBIG for All</h1>
<p>متجرك الإلكتروني</p>
</header>

<div class="container">

<h2>المنتجات</h2>

<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 سلة الطلب</h2>
<div id="cart"></div>

<div class="total">
الإجمالي: <span id="total">0</span> دينار
</div>

<h3>بيانات العميل</h3>

<input id="name" placeholder="الاسم الكامل">
<input id="phone" placeholder="رقم الهاتف">
<input id="address" placeholder="العنوان">

<button onclick="sendOrder()" style="width:100%">
إرسال الطلب
</button>
</div>

</div>

<script>

const products=[
{
 id:1,
 name:"منتج تجريبي 1",
 price:10,
 image:"https://via.placeholder.com/400x300?text=GOBIG"
},
{
 id:2,
 name:"منتج تجريبي 2",
 price:15,
 image:"https://via.placeholder.com/400x300?text=GOBIG"
},
{
 id:3,
 name:"منتج تجريبي 3",
 price:20,
 image:"https://via.placeholder.com/400x300?text=GOBIG"
},
{
 id:4,
 name:"منتج تجريبي 4",
 price:25,
 image:"https://via.placeholder.com/400x300?text=GOBIG"
}
];

let cart=[];

function showProducts(){
 const box=document.getElementById("products");
 box.innerHTML="";

 products.forEach(p=>{
  box.innerHTML+=`
  <div class="card">
   <img src="${p.image}">
   <h3>${p.name}</h3>
   <div class="price">${p.price} دينار</div>
   <br>
   <button onclick="addToCart(${p.id})">
   أضف للسلة
   </button>
  </div>`;
 });
}

function addToCart(id){
 const p=products.find(x=>x.id===id);
 cart.push(p);
 showCart();
}

function removeFromCart(index){
 cart.splice(index,1);
 showCart();
}

function showCart(){
 const box=document.getElementById("cart");
 box.innerHTML="";

 let total=0;

 cart.forEach((p,i)=>{
  total+=p.price;

  box.innerHTML+=`
  <div class="cart-item">
   <span>${p.name}</span>
   <span>
   ${p.price} د
   <button onclick="removeFromCart(${i})">×</button>
   </span>
  </div>`;
 });

 document.getElementById("total").textContent=total;
}

function sendOrder(){

 if(cart.length===0){
  alert("السلة فارغة");
  return;
 }

 const name=document.getElementById("name").value;
 const phone=document.getElementById("phone").value;
 const address=document.getElementById("address").value;

 if(!name || !phone || !address){
  alert("يرجى تعبئة جميع البيانات");
  return;
 }

 let order={
  name:name,
  phone:phone,
  address:address,
  products:cart,
  total:cart.reduce((s,p)=>s+p.price,0),
  date:new Date().toISOString()
 };

 localStorage.setItem(
  "lastOrder",
  JSON.stringify(order)
 );

 alert("تم إرسال الطلب بنجاح ✅");

 cart=[];
 showCart();
}

showProducts();
showCart();

</script>

</body>
</html>
